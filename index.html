<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172c3c"><title>PHILO CLASS — Terminale A</title><link rel="manifest" href="manifest.webmanifest">
<style>
:root{--navy:#172c3c;--teal:#1c7772;--gold:#d5a84e;--paper:#f5f3ed;--ink:#23313b;--muted:#687781;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
header{background:var(--navy);color:white;padding:24px max(20px,calc((100% - 1120px)/2));display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}
.brand{font-weight:850;font-size:1.35rem;letter-spacing:.08em}.brand small{display:block;font-weight:400;letter-spacing:0;color:#dce5e9;font-size:.85rem}
button,select,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--teal);color:white;font-weight:650}
button.secondary{background:#e7ecec;color:var(--navy)}button.active{background:var(--gold);color:#172c3c}
nav{background:white;border-bottom:1px solid #dce2e2;display:flex;gap:8px;padding:10px max(14px,calc((100% - 1120px)/2));overflow:auto;position:sticky;top:0;z-index:5}
nav button{white-space:nowrap;background:transparent;color:var(--navy)}nav button.active{background:var(--navy);color:white}
main{max-width:1120px;margin:26px auto;padding:0 18px}.hero{background:linear-gradient(120deg,#17364a,#1c7772);color:white;padding:28px;border-radius:18px;margin-bottom:22px}.hero h1{font-size:clamp(1.8rem,4vw,2.7rem);margin:0 0 8px}.hero p{max-width:760px;margin:0;color:#e4eeee}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:white;border:1px solid #e0e5e3;border-radius:14px;padding:18px;box-shadow:0 4px 14px #132c3c0a}.card h3{margin:5px 0 8px}.muted{color:var(--muted)}.tag{font-size:.78rem;color:var(--teal);font-weight:750;text-transform:uppercase;letter-spacing:.04em}
.layout{display:grid;grid-template-columns:270px 1fr;gap:18px}.sidebar{background:white;border-radius:14px;padding:12px;align-self:start;max-height:75vh;overflow:auto}.lessonpick{display:block;width:100%;text-align:left;background:white;color:var(--ink);margin:3px 0;font-weight:550}.lessonpick.active{background:#e6f0ee;color:#145c58}
.content{background:white;border-radius:14px;padding:clamp(16px,3vw,30px);min-width:0}.content h1{line-height:1.2}.content h2{color:var(--teal);font-size:1.15rem;margin-top:26px}.content h3{margin-bottom:4px}.pill{display:inline-block;background:#edf3f2;color:#245b59;padding:4px 9px;border-radius:30px;font-size:.8rem;margin:3px}
details{border:1px solid #e4e9e7;border-radius:10px;padding:12px;margin:9px 0}summary{font-weight:700;cursor:pointer}.mg{background:#f2f6ef;border-left:3px solid #80a66c;padding:12px;border-radius:6px}
input[type=search],input[type=text],textarea{width:100%;padding:12px;border:1px solid #ccd5d5;border-radius:9px;background:white}textarea{min-height:170px}
table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #e5e9e8;text-align:left;vertical-align:top}
footer{text-align:center;color:var(--muted);padding:35px 15px;font-size:.85rem}
@media(max-width:760px){.layout{grid-template-columns:1fr}.sidebar{max-height:230px}.hero{padding:22px}}
</style></head><body>
<header><div class="brand">PHILO CLASS <small>Terminale A · Ancien système scolaire malgache</small></div><div><button class="secondary" id="lang">FR / MG</button></div></header>
<nav id="nav"><button class="active" data-view="home">Accueil</button><button data-view="courses">Cours complets</button><button data-view="dictionary">Dictionnaire FR–MG</button><button data-view="methods">Méthodologie</button><button data-view="quiz">Évaluations</button><button data-view="notes">Mes notes</button></nav>
<main id="app"></main><footer>PHILO CLASS · Support pédagogique évolutif · Vérifier les références dans l'édition utilisée en classe.</footer>
<script src="content.js"></script><script>
const D=window.PHILO_DATA;let view='home',selected=0,lang='fr';
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setView(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
document.getElementById('lang').onclick=()=>{lang=lang==='fr'?'mg':'fr';render()};
function home(){let parts=[...new Set(D.lessons.map(x=>x.part))];return `<section class="hero"><h1>Penser, questionner, argumenter.</h1><p>Un espace de cours, de notions bilingues français–malgache, de méthodologie et d'entraînement pour accompagner l'étude de la philosophie en Terminale A.</p><p style="margin-top:18px"><span class="pill">5 grandes parties</span><span class="pill">${D.lessons.length} chapitres</span><span class="pill">${D.dictionary.length} notions</span><span class="pill">Quiz et notes personnelles</span></p></section><div class="grid"><div class="card"><div class="tag">Programme</div><h3>${D.lessons.length} chapitres structurés</h3><p class="muted">Dans l'ordre du programme retenu, de la philosophie à l'État.</p><button onclick="setView('courses')">Accéder aux cours</button></div><div class="card"><div class="tag">Notions</div><h3>Dictionnaire bilingue</h3><p class="muted">Définitions de notions philosophiques en français et en malgache.</p><button onclick="setView('dictionary')">Explorer</button></div><div class="card"><div class="tag">Savoir-faire</div><h3>Méthodologie</h3><p class="muted">Apprendre à construire une dissertation et expliquer un texte.</p><button onclick="setView('methods')">Travailler la méthode</button></div><div class="card"><div class="tag">Révision</div><h3>Évaluations</h3><p class="muted">Questions à choix multiples avec explications.</p><button onclick="setView('quiz')">Commencer un quiz</button></div></div><h2>Les parties du programme</h2><div class="grid">${parts.map(p=>`<div class="card"><div class="tag">${esc(p)}</div><h3>${D.lessons.filter(x=>x.part===p).length} chapitres</h3><button onclick="setView('courses')">Voir les leçons</button></div>`).join('')}</div>`}
function course(){let l=D.lessons[selected];return `<div class="layout"><aside class="sidebar"><input type="search" id="lessonSearch" placeholder="Rechercher un chapitre…"><div id="lessonList">${D.lessons.map((x,i)=>`<button class="lessonpick ${i===selected?'active':''}" onclick="selected=${i};render()"><small>${esc(x.part)}</small><br>${esc(x.title)}</button>`).join('')}</div></aside><article class="content"><div class="tag">${esc(l.part)} · ${esc(l.duration)}</div><h1>${esc(l.title)}</h1><h2>Objectifs pédagogiques</h2><ul>${l.objectives.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h2>Prérequis</h2><p>${esc(l.prereq)}</p><h2>Situation-problème et problématique</h2><p><b>Question de départ :</b> ${esc(l.problem)}</p><h2>Notions fondamentales</h2>${l.defs.map(d=>`<details open><summary>${esc(d[0])}</summary><p>${esc(d[1])}</p><div class="mg"><b>Malagasy :</b> ${esc(d[2])}</div></details>`).join('')}<h2>Développement du cours</h2>${l.development.map(d=>`<h3>${esc(d[0])}</h3><p>${esc(d[1])}</p>`).join('')}<h2>Repères philosophiques et références</h2>${l.authors.map(a=>`<details><summary>${esc(a[0])}</summary><p>${esc(a[1])}</p><p class="muted"><b>Repère bibliographique :</b> ${esc(a[2])}</p></details>`).join('')}<h2>Exemple contextualisé</h2><p>${esc(l.example)}</p><h2>Résumé à dicter</h2><div class="card">${esc(l.summary)}<p class="mg"><b>Hevitra fototra :</b> ${esc(l.mg)}</p></div><h2>Activités d'apprentissage</h2><ol>${l.activities.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><h2>Évaluation formative et corrigé</h2>${l.assessment.map((a,i)=>`<details><summary>${i+1}. ${esc(a[0])}</summary><p>${esc(a[1])}</p></details>`).join('')}<p class="muted">Fiche indicative : adapter la durée, les exemples et le niveau de détail aux deux séances hebdomadaires et aux exigences de la classe.</p></article></div>`}
function dictionary(){return `<section class="hero"><h1>Dictionnaire philosophique FR–MG</h1><p>Définitions de travail et équivalents malgaches. Certains termes n'ont pas d'équivalent strict : la traduction doit être comprise dans son contexte philosophique.</p></section><input type="search" id="dictSearch" placeholder="Rechercher une notion en français ou en malgache…"><div class="grid" id="dictGrid" style="margin-top:16px">${D.dictionary.map(x=>`<div class="card dictitem"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p><div class="mg">${esc(x[2])}</div></div>`).join('')}</div>`}
function methodology(){return `<section class="hero"><h1>Méthodologie philosophique</h1><p>Des démarches à appliquer progressivement. La méthode ne remplace jamais l'analyse personnelle du sujet ou du texte.</p></section>${D.methods.map(m=>`<article class="content" style="margin-bottom:16px"><h2 style="margin-top:0">${esc(m[0])}</h2>${m[1].map(x=>`<details open><summary>${esc(x[0])}</summary><p>${esc(x[1])}</p></details>`).join('')}</article>`).join('')}<article class="content"><h2>Exemple de problématisation</h2><p><b>Sujet :</b> « La liberté consiste-t-elle à faire tout ce que l'on veut ? »</p><p><b>Analyse :</b> « liberté » peut désigner l'absence de contrainte ou l'autonomie ; « tout faire » suggère l'absence de limites.</p><p><b>Tension :</b> les règles limitent certains actes, mais elles peuvent aussi protéger la liberté de chacun.</p><p><b>Problématique possible :</b> les limites imposées à nos désirs détruisent-elles la liberté, ou sont-elles nécessaires pour rendre possible une liberté commune ?</p></article>`}
function quizView(){return `<section class="hero"><h1>Évaluation de révision</h1><p>${D.quiz.length} questions · Une réponse par question · Correction immédiate.</p></section><div class="content">${D.quiz.map((q,i)=>`<div class="quizq" style="margin-bottom:22px"><h3>${i+1}. ${esc(q[0])}</h3>${q[1].map((o,j)=>`<label style="display:block;padding:7px"><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join('')}<div id="feedback${i}" class="muted"></div></div>`).join('')}<button onclick="grade()">Corriger mes réponses</button><h2 id="score"></h2></div>`}
function notes(){return `<section class="hero"><h1>Mes notes personnelles</h1><p>Les notes sont enregistrées dans le stockage local de cet appareil et de ce navigateur.</p></section><div class="content"><textarea id="notesArea" placeholder="Écris ici tes idées, exemples, questions ou résumés…"></textarea><p><button onclick="saveNotes()">Enregistrer mes notes</button> <span id="saved" class="muted"></span></p></div>`}
function grade(){let score=0;D.quiz.forEach((q,i)=>{let a=document.querySelector('input[name="q'+i+'"]:checked');let f=document.getElementById('feedback'+i);if(a&&+a.value===q[2]){score++;f.innerHTML='<span style="color:green">Correct.</span> '+esc(q[3])}else{f.innerHTML='<span style="color:#a33">À revoir.</span> '+esc(q[3])+' Réponse : '+esc(q[1][q[2]])}});document.getElementById('score').textContent='Résultat : '+score+'/'+D.quiz.length}
function saveNotes(){localStorage.setItem('philo-notes',document.getElementById('notesArea').value);document.getElementById('saved').textContent='Notes enregistrées.'}
function render(){if(view==='home')app.innerHTML=home();if(view==='courses')app.innerHTML=course();if(view==='dictionary')app.innerHTML=dictionary();if(view==='methods')app.innerHTML=methodology();if(view==='quiz')app.innerHTML=quizView();if(view==='notes'){app.innerHTML=notes();document.getElementById('notesArea').value=localStorage.getItem('philo-notes')||''}
let ls=document.getElementById('lessonSearch');if(ls)ls.oninput=()=>{document.querySelectorAll('.lessonpick').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(ls.value.toLowerCase())?'block':'none')};
let ds=document.getElementById('dictSearch');if(ds)ds.oninput=()=>{document.querySelectorAll('.dictitem').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(ds.value.toLowerCase())?'block':'none')};
}
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
